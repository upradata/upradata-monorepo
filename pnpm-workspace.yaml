packages:
    - 'libs/*'
    - 'apps/*'
    - 'tools/*'
    - 'configs/*'
allowBuilds:
    esbuild: true
catalog:
    '@changesets/cli': ^3.0.3
    '@commitlint/cli': ^21.2.4
    '@commitlint/config-conventional': ^21.2.4
    '@typescript/typescript6': ^6.0.2
    tsx: ^4.23.15
    turbo: ^2.11.10
    typescript: ^7.0.2
    vite: npm:@voidzero-dev/vite-plus-core@1.3.0
    vitest: 5.0.5
    vite-plus: 1.3.0
    '@vitest/coverage-v8': 5.0.5
overrides:
    vite@*: 'catalog:'
    vitest@*: 'catalog:'
peerDependencyRules:
    allowAny:
        - vite
        - vitest
    allowedVersions:
        vite: '*'
        vitest: '*'
